
services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: ia-commerce-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - TZ=America/Recife
      - GENERIC_TIMEZONE=America/Recife
      - N8N_RUNNERS_MODE=external
      - N8N_RUNNERS_BROKER_LISTEN_ADDRESS=0.0.0.0
      - N8N_RUNNERS_AUTH_TOKEN=troque-por-uma-chave-longa-e-unica
      - N8N_NATIVE_PYTHON_RUNNER=true
    volumes:
      - n8n_data:/home/node/.n8n

  ollama:
    image: ollama/ollama:latest
    container_name: ia-commerce-ollama
    restart: unless-stopped
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    

  runners:
    image: n8nio/runners:2.43.7
    container_name: ia-commerce-runners
    restart: unless-stopped
    environment:
      - N8N_RUNNERS_TASK_BROKER_URI=http://n8n:5679
      - N8N_RUNNERS_AUTH_TOKEN=troque-por-uma-chave-longa-e-unica
      - N8N_NATIVE_PYTHON_RUNNER=true
    depends_on:
      - n8n

volumes:
  n8n_data:
  ollama_data:
